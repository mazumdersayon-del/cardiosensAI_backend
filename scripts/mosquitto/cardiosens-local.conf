# Local development broker (run_local.sh): plain MQTT on 127.0.0.1:1883 / the LAN with --lan.
# Production (deploy.sh) uses TLS on 8883 with the Let's Encrypt certificate instead.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/cardiosens.acl
use_username_as_clientid true
max_packet_size 600000
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
