[project]
name = "cardiosensai-backend"
version = "0.2.0"
description = "CardiosensAI connected health monitoring platform — API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.15",
  "email-validator>=2.3",
  "pyjwt[crypto]>=2.15",  # crypto: RS256, for verifying Google sign-in tokens
  "pyotp>=2.10",
  "argon2-cffi>=25.1",
  "reportlab>=5.0",
  "python-multipart>=0.0.20",
  "paho-mqtt>=2.1",  # device bridge (MQTT over TLS to the Mosquitto broker)
]

[project.optional-dependencies]
s3 = ["boto3>=1.43"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]  # exact: dev tools are not in the lock file

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
